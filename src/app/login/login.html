<div class="login-container">
    <div class="login-card">
        <h1>Admin Login</h1>
        <p>Please login to access the dashboard.</p>

        <form (ngSubmit)="login()" #loginForm="ngForm">
            <label>Username</label>
            <input type="text" name="username" [(ngModel)]="username" placeholder="Enter username" required />

            <label>Password</label>
            <input type="password" name="password" [(ngModel)]="password" placeholder="Enter password" required />

            <p class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </p>

            <button type="submit" [disabled]="loginForm.invalid">
                Login
            </button>
        </form>
    </div>
</div>
