
<div class="container">
  <div class="form-card">
    <h1>Enquiry Form</h1>
    <p>Please fill in your details below.</p>

    <form #enquiryForm="ngForm"
          (ngSubmit)="submitEnquiry(enquiryForm)">

      <label>Full Name</label>
      <input type="text" name="name"
        [(ngModel)]="enquiry.name"
        placeholder="Enter your full name" required />

      <label>Email Address</label>
      <input type="email" name="email"
        [(ngModel)]="enquiry.email"
        placeholder="Enter your email" required />

      <label>Mobile Number</label>
      <input type="tel" name="mobile"
        [(ngModel)]="enquiry.mobile"
        placeholder="Enter your mobile number" required />

      <label>Subject</label>
      <input type="text" name="subject"
        [(ngModel)]="enquiry.subject"
        placeholder="Enter enquiry subject" required />

      <label>Message</label>
      <textarea name="message"
        [(ngModel)]="enquiry.message"
        placeholder="Write your enquiry"
        rows="4" required></textarea>

      <button type="submit" [disabled]="enquiryForm.invalid">
        Submit Enquiry
      </button>
    </form>
  </div>
</div>
